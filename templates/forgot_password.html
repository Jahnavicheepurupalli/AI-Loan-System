{% extends "base.html" %}

{% block content %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem 5%;
    }
    .auth-card {
        width: 100%;
        max-width: 450px;
        padding: 2.5rem;
        border-radius: var(--radius-md);
    }
    .auth-title {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-title h2 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }
    .password-input-wrapper {
        position: relative;
    }
    .password-toggle-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--text-muted);
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
    }
</style>

<div class="auth-container">
    <div class="auth-card glass-panel">
        <div class="auth-title">
            <h2>Reset Password</h2>
            <p>Update credentials directly for your account</p>
        </div>
        
        <form id="forgot-form">
            <!-- Email -->
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter registered email">
            </div>

            <button type="button" class="btn btn-primary" id="btn-continue-email" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
                Continue <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <div id="password-fields-container" style="display: none;">
                <!-- New Password -->
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Min 8 characters, Cap, Num, Special">
                        <i class="fa-solid fa-eye password-toggle-icon" id="toggle-new-pwd"></i>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm new password">
                        <i class="fa-solid fa-eye password-toggle-icon" id="toggle-confirm-pwd"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
                    <i class="fa-solid fa-key"></i> Update Password
                </button>
            </div>
        </form>
        
        <div class="auth-footer">
            <p>Remembered credentials? <a href="/login" style="font-weight: 600;">Login Here</a></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const emailInput = document.getElementById("email");
        const newPwdInput = document.getElementById("new_password");
        const confirmInput = document.getElementById("confirm_password");
        const toggleNew = document.getElementById("toggle-new-pwd");
        const toggleConfirm = document.getElementById("toggle-confirm-pwd");
        const forgotForm = document.getElementById("forgot-form");
        const btnContinue = document.getElementById("btn-continue-email");
        const pwdContainer = document.getElementById("password-fields-container");

        // Continue Handler
        btnContinue.addEventListener("click", () => {
            if (!emailInput.value.trim() || !emailInput.checkValidity()) {
                showToast("Please enter a valid registered email address.", "warning");
                emailInput.reportValidity();
                return;
            }
            pwdContainer.style.display = "block";
            btnContinue.style.display = "none";
            newPwdInput.setAttribute("required", "required");
            confirmInput.setAttribute("required", "required");
        });

        // Hide/Show Toggle
        toggleNew.addEventListener("click", () => {
            if (newPwdInput.type === "password") {
                newPwdInput.type = "text";
                toggleNew.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                newPwdInput.type = "password";
                toggleNew.classList.replace("fa-eye-slash", "fa-eye");
            }
        });

        toggleConfirm.addEventListener("click", () => {
            if (confirmInput.type === "password") {
                confirmInput.type = "text";
                toggleConfirm.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                confirmInput.type = "password";
                toggleConfirm.classList.replace("fa-eye-slash", "fa-eye");
            }
        });

        // Form Submission
        forgotForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = emailInput.value;
            const new_password = newPwdInput.value;
            const confirm_password = confirmInput.value;
            
            if (new_password !== confirm_password) {
                showToast("Passwords do not match!", "error");
                return;
            }
            
            try {
                const result = await apiPost("/auth/forgot-password", { email, new_password, confirm_password });
                
                showToast(result.message || "Password Reset Successful!", "success");
                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);
            } catch(err) {
                console.error(err);
                showToast(err.message || "Password Reset Failed", "error");
            }
        });
    });
</script>
{% endblock %}
